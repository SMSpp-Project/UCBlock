default:
  image: registry.gitlab.com/smspp/smspp-project

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - smspp-project

stages:
  - build
  - test
  - test-pph
  - deploy

build:
  stage: build
  script:
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SMSPP_DEPLOY_KEY")
    - mkdir -p ~/.ssh && ssh-keyscan -H gitlab.com >> ~/.ssh/known_hosts
    - if [ -d smspp-project ]; then (cd smspp-project && git pull && git submodule update --recursive); else git clone --branch develop git@gitlab.com:smspp/smspp-project.git; fi
    - cmake -S smspp-project -B smspp-project/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBUILD_UCBlock=ON -DBUILD_LagrangianDualSolver=ON -DBUILD_BundleSolver=ON -DBUILD_MILPSolver=ON -DBUILD_tests=ON
    - cmake --build smspp-project/build --target install
  artifacts:
    paths:
      - smspp-project/build
  only:
    refs:
      - develop
      - tags
    changes:
      - cmake/*
      - include/*
      - src/*
      - test/*
      - tools/*
      - CMakeLists.txt
      - .gitlab-ci.yml

# the full ucblock suite exceeds the 3h GitLab.com shared-runner job cap when
# run as one job (metabatch-PPH under PrimalProximalHeur alone is ~1.5h), so it
# is split into two SEQUENTIAL stages, each comfortably under 3h: metabatch
# (slv=0) + TUDPS here, metabatch-PPH (slv=1) next. Sequential, not parallel, to
# keep within the two concurrent Gurobi sessions the academic WLS license grants.
.test_template:
  timeout: 24h
  # the academic Gurobi WLS license caps concurrent sessions: a test job may
  # abort at startup with "GRBstartenv returned with status 10030" when other
  # Gurobi-heavy pipelines hold the sessions. Retry to ride out the contention.
  retry:
    max: 2
    when: script_failure
  before_script:
    # write the Gurobi WLS license from the masked CI/CD variables, if set
    - |
      if [ -n "$GRB_WLSSECRET" ]; then
        printf 'LICENSEID=%s\nWLSACCESSID=%s\nWLSSECRET=%s\n' \
          "$GRB_LICENSEID" "$GRB_WLSACCESSID" "$GRB_WLSSECRET" > /tmp/gurobi.lic
        export GRB_LICENSE_FILE=/tmp/gurobi.lic
      fi
  only:
    refs:
      - develop
      - tags
    changes:
      - cmake/*
      - include/*
      - src/*
      - test/*
      - tools/*
      - CMakeLists.txt
      - .gitlab-ci.yml

test:
  extends: .test_template
  stage: test
  script:
    - ctest -V -C Release -L "$CI_PROJECT_TITLE" -E metabatch-PPH --test-dir smspp-project/build --no-tests=error

test-pph:
  extends: .test_template
  stage: test-pph
  script:
    - ctest -V -C Release -L "$CI_PROJECT_TITLE" -R metabatch-PPH --test-dir smspp-project/build --no-tests=error

deploy:
  stage: deploy
  script:
    - cd smspp-project/build && cpack -G "TGZ;ZIP;TBZ2"
  artifacts:
    paths:
      - smspp-project/build/*.tar.gz
      - smspp-project/build/*.tar.bz2
      - smspp-project/build/*.zip
  only:
    - tags

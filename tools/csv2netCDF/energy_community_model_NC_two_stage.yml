      OEM_lin: 5  # [€/kWh/y] specific O&M cost
      lifetime_y: 15  # [y] lifetime of the component
      eta: 0.92  # [-] roundtrip efficiency
      max_SOC: 1.0  # [-] maximum state of charge
      min_SOC: 0.2  # [-] minimum state of charge
      max_capacity: 50  # [kW] maximum capacity
      max_C_dch: 1.0  # [-] maximum C-rate in discharge
      max_C_ch: 1.0  # [-] maximum C-rate in charge
      corr_asset: conv  # corresponding converter
      nom_capacity: 1  # [kW] nominal capacity of a base plant
      modularity: true  # [bool] integer (true) vs. continuous (false) design

    conv:  # component converter
      type: converter  # type of component
      CAPEX_lin: 200  # [€/kW] specific investment cost of the component
      OEM_lin: 2  # [€/kW/y] specific O&M cost
      lifetime_y: 10  # [y] lifetime of the component
      eta: 1.0  # [-] roundtrip efficiency
      max_dch: 1.0  # [-] maximum discharge rate relative to converter capacity (UNUSED: documented by EC.jl but never read by its model code, and not written to the SMS++ BatteryUnitBlock netCDF either; the effective discharge bound comes from batt.max_C_dch)
      min_ch: 0.1  # [-] minimum charge rate relative to converter capacity   (UNUSED: documented by EC.jl but never read by its model code, and not written to the SMS++ BatteryUnitBlock netCDF either; the effective charge bound comes from batt.max_C_ch)
      max_capacity: 50  # [kW] maximum capacity
      corr_asset: batt  # corresponding battery
      nom_capacity: 1  # [kW] nominal capacity of a base plant
      modularity: true  # [bool] integer (true) vs. continuous (false) design


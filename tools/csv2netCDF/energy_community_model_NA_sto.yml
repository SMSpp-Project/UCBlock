general:  # general input parameters
  init_step: 1  # initial time step
  final_step: 24  # final time step (kept short for solver tractability)
  d_rate: 0.03  # discount rate
  project_lifetime: 20  # [y] project lifetime
  user_set: [user1, user2, user3, user4, user5, user6, user7, user8, user9, user10]  # list of users for the simulation

  # Stochastic configuration — schema aligned with EC.jl@stochastic.
  n_s: 3
  n_eps: 1
  uncertain_var: L

  optional_datasets:
    - input_resource_sto.csv
    - market_data_sto.csv

market:
  profile:
    buy_price: buy_price
    sell_price: sell_price
    consumption_price: consumption_price
    reward_price: reward_price
    penalty_price: penalty_price
    peak_categories: peak_categories
    peak_tariff:
      function: parse_peak_quantity_by_time_vectors
      inputs:
        - peak_categories
        - peak_tariff
    energy_weight: energy_weight
    peak_weight:
      function: parse_peak_quantity_by_time_vectors
      inputs:
        - peak_categories
        - peak_weight
    time_res: time_res

users:  # list of users and the corresponding assets — No-Asset case: load only

  user1:
    load:
      type: load
      profile:
        load: load_user1
        std: std_load_user1

  user2:
    load:
      type: load
      profile:
        load: load_user2
        std: std_load_user2

  user3:
    load:
      type: load
      profile:
        load: load_user3
        std: std_load_user3

  user4:
    load:
      type: load
      profile:
        load: load_user4
        std: std_load_user4

  user5:
    load:
      type: load
      profile:
        load: load_user5
        std: std_load_user5

  user6:
